services:
  e2e:
    build:
      dockerfile: ./Dockerfile
    volumes:
      - ./specs:/usr/src/app/specs
    depends_on:
      - reservations
      - auth
      - payments
      - notifications
      - mongo
  reservations:
    image: us-east1-docker.pkg.dev/sleepr-506112/reservations/production
    env_file:
      - ../apps/reservations/.env
    ports:
      - '3000:3000'

  auth:
    image: us-east1-docker.pkg.dev/sleepr-506112/auth/production
    env_file:
      - ../apps/auth/.env
    ports:
      - '3001:3001'

  payments:
    image: us-east1-docker.pkg.dev/sleepr-506112/payments/production
    env_file:
      - ../apps/payments/.env

  notifications:
    image: us-east1-docker.pkg.dev/sleepr-506112/notifications/production
    env_file:
      - ../apps/notifications/.env

  mongo:
    image: mongo:7.0
