$kind: http-request
name: Login
method: POST
url: '{{authBaseUrl}}/auth/login'
order: 2000
description: Authenticate with email and password. Returns user data and sets a JWT cookie (`Authentication`).
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "StrongP@ssw0rd!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const cookie = pm.cookies.get('Authentication');
      if (cookie) {
        pm.collectionVariables.set('jwt', cookie);
        console.log('JWT saved to collection variable: jwt');
      }
