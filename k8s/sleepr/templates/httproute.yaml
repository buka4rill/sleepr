{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sleepr
spec:
  parentRefs:
    - name: sleepr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /reservations
      backendRefs:
        - name: reservations
          port: {{ .Values.reservations.env.PORT }}
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: auth-http
          port: {{ .Values.auth.env.HTTP_PORT }}
    - matches:
        - path:
            type: PathPrefix
            value: /users
      backendRefs:
        - name: auth-http
          port: {{ .Values.auth.env.HTTP_PORT }}
{{- end }}
